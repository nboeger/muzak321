name: muzak321
base: core22
version: 0.1.18
summary: A command-line music player
title: muzak321 — Music Player
description: |
  muzak321 is a command-line music player (MP3, FLAC, OGG, WAV) with a file
  browser, progress bar, and playlist. It streams live Internet radio and
  reads audio tags to show Title / Artist while playing.

  It plays audio files, M3U and PLS playlists, local directories, glob
  patterns, and live SHOUTcast/Icecast MP3 streams.

grade: stable
confinement: strict
contact: https://github.com/nboeger/muzak321/issues
issues: https://github.com/nboeger/muzak321/issues
website: https://github.com/nboeger/muzak321
source-code: https://github.com/nboeger/muzak321
license: GPL-3.0

apps:
  muzak321:
    command: bin/muzak321-launcher
    plugs:
      - home
      - audio-playback
      - network

layout:
  /etc/alsa/conf.d:
    bind: $SNAP/usr/share/alsa/conf.d

parts:
  muzak321:
    plugin: nil
    source: .
    build-packages:
      - gcc
      - libasound2-dev
    stage:
      - -usr/share/doc
      - -usr/share/lintian
    override-build: |
      set -eux
      # Version comes from the git tag (matches the snap 'version: 0.1.18'
      # label) so a release can never ship with a stale version string.
      VERSION=$(git describe --tags --always 2>/dev/null | tr -d '\n')
      [ -n "$VERSION" ] || VERSION="0.0.0"
      ARCH=$(uname -m)
      case "$ARCH" in
        x86_64)  GOARCH=amd64 ;;
        aarch64) GOARCH=arm64 ;;
        *) echo "unsupported arch: $ARCH"; exit 1 ;;
      esac
      # core22 ships Go 1.22; the project needs >= 1.25.0
      curl -fsSLo /tmp/go.tgz "https://go.dev/dl/go1.25.0.linux-$GOARCH.tar.gz"
      rm -rf /tmp/gotoolchain
      mkdir -p /tmp/gotoolchain
      tar -C /tmp/gotoolchain --strip-components=1 -xzf /tmp/go.tgz
      export GOROOT=/tmp/gotoolchain
      export PATH="$GOROOT/bin:$PATH"
      CGO_ENABLED=1 \
        go build -trimpath \
        -ldflags "-s -w -X main.version=$VERSION" \
        -o muzak321 .
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      cp muzak321 "$CRAFT_PART_INSTALL/bin/"
      # Launcher sets PULSE_SERVER/ALSA paths for the strict-snap runtime and
      # then execs the real binary.
      cp "$CRAFT_PROJECT_DIR/snap/local/scripts/muzak321-launcher" \
         "$CRAFT_PART_INSTALL/bin/muzak321-launcher"
      chmod +x "$CRAFT_PART_INSTALL/bin/muzak321-launcher"
      # ALSA default routing: try PulseAudio, fall back to hw (dynamic).
      # The layout section binds $SNAP/usr/share/alsa/conf.d into
      # /etc/alsa/conf.d, which the staged alsa.conf loads, so the override is
      # applied inside the snap.
      mkdir -p "$CRAFT_PART_INSTALL/usr/share/alsa/conf.d"
      cp "$CRAFT_PROJECT_DIR/snap/local/alsa/50-muzak321-default.conf" \
         "$CRAFT_PART_INSTALL/usr/share/alsa/conf.d/50-muzak321-default.conf"
      # Stage the ALSA->PulseAudio bridge (pulse plugin + libpulse) from the
      # bundled jammy debs. We avoid stage-package libasound2-plugins because
      # on newer build hosts it pulls a dependency tree that is incompatible
      # with the core22 base (glibc too new).
      ARCH_TRIPLET="$CRAFT_ARCH_TRIPLET_BUILD_FOR"
      for deb in "$CRAFT_PROJECT_DIR"/snap/local/alsa/debs/*.deb; do
        dpkg-deb -x "$deb" "$CRAFT_PART_INSTALL"
      done
      # Remove oss4-libsalsa remnants if any (jammy libasound needs none).
      rm -rf "$CRAFT_PART_INSTALL/usr/lib/$ARCH_TRIPLET/oss4-libsalsa"
      # The libasound2-plugins deb ships symlinks in etc/alsa/conf.d pointing
      # outside the snap; the store rejects external symlinks, and we manage
      # /etc/alsa/conf.d via the layout anyway, so drop them.
      rm -rf "$CRAFT_PART_INSTALL/etc/alsa/conf.d"
      # libpulsecommon lives in the pulseaudio/ subdir but snapd only searches
      # the main lib dir; expose it there too.
      for f in "$CRAFT_PART_INSTALL/usr/lib/$ARCH_TRIPLET"/pulseaudio/libpulsecommon-*.so; do
        [ -e "$f" ] && ln -sf "pulseaudio/$(basename "$f")" "$CRAFT_PART_INSTALL/usr/lib/$ARCH_TRIPLET/$(basename "$f")"
      done