name: muzak321
base: core22
version: 0.1.13
summary: A command-line music player
title: muzak321 — Music Player
description: |
  muzak321 is a command-line music player (MP3, FLAC, OGG, WAV) with a file
  browser, progress bar, and playlist. It streams live Internet radio and
  reads audio tags to show Title / Artist while playing.

  It plays audio files, M3U and PLS playlists, local directories, glob
  patterns, and live SHOUTcast/Icecast MP3 streams.

grade: stable
confinement: strict
contact: https://github.com/nboeger/muzak321/issues
issues: https://github.com/nboeger/muzak321/issues
website: https://github.com/nboeger/muzak321
source-code: https://github.com/nboeger/muzak321
license: GPL-3.0

apps:
  muzak321:
    command: bin/muzak321
    environment:
      ALSA_CONFIG_DIR: $SNAP/usr/share/alsa
    plugs:
      - home
      - audio-playback
      - network

layout:
  /etc/alsa/conf.d:
    bind: $SNAP/usr/share/alsa/conf.d

parts:
  muzak321:
    plugin: nil
    source: .
    build-packages:
      - gcc
      - libasound2-dev
    stage-packages:
      - libasound2
      - libasound2-plugins
      - libasound2-data
    stage:
      - -usr/share/doc
      - -usr/share/lintian
    override-build: |
      set -eux
      VERSION=$(awk '/^version:/{print $2}' "$CRAFT_PROJECT_DIR/snap/snapcraft.yaml" | head -1)
      [ -n "$VERSION" ] || VERSION="0.0.0"
      ARCH=$(uname -m)
      case "$ARCH" in
        x86_64)  GOARCH=amd64 ;;
        aarch64) GOARCH=arm64 ;;
        *) echo "unsupported arch: $ARCH"; exit 1 ;;
      esac
      # core22 ships Go 1.22; the project needs >= 1.25.0
      curl -fsSLo /tmp/go.tgz "https://go.dev/dl/go1.25.0.linux-$GOARCH.tar.gz"
      rm -rf /tmp/gotoolchain
      mkdir -p /tmp/gotoolchain
      tar -C /tmp/gotoolchain --strip-components=1 -xzf /tmp/go.tgz
      export GOROOT=/tmp/gotoolchain
      export PATH="$GOROOT/bin:$PATH"
      CGO_ENABLED=1 \
        go build -trimpath \
        -ldflags "-s -w -X main.version=$VERSION" \
        -o muzak321 .
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      cp muzak321 "$CRAFT_PART_INSTALL/bin/"
      # ALSA default routing: try PulseAudio, fall back to hw (dynamic).
      # The layout section binds $SNAP/usr/share/alsa/conf.d into
      # /etc/alsa/conf.d, which the staged alsa.conf loads, so the override is
      # applied inside the snap.
      mkdir -p "$CRAFT_PART_INSTALL/usr/share/alsa/conf.d"
      cp "$CRAFT_PROJECT_DIR/snap/local/alsa/50-muzak321-default.conf" \
         "$CRAFT_PART_INSTALL/usr/share/alsa/conf.d/50-muzak321-default.conf"
      # libasound.so.2 (core22) links libOSSlib.so, which is staged into an
      # oss4-libsalsa/ subdir off the loader path; expose it in the standard lib dir.
      cp -n "$CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/oss4-libsalsa/libOSSlib.so" \
            "$CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/" 2>/dev/null || true