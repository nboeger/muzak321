# muzak321 ALSA default routing.
#
# Loaded by ALSA from /etc/alsa/conf.d (via the snap layout). Routes the ALSA
# "default" device through PulseAudio (or PipeWire-pulse) when a server is
# reachable, falling back to the first hardware device otherwise. This makes
# playback work on PulseAudio systems, PipeWire systems, and plain ALSA
# systems without changing the app.

pcm.!default {
    type pulse
    fallback "plughw:0,0"
    hint {
        show on
        description "PulseAudio Sound Server"
    }
}

ctl.!default {
    type pulse
    fallback "plughw:0,0"
}
