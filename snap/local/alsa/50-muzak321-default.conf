# Route ALSA "default" through PulseAudio (or PipeWire-pulse) when a server is
# reachable, falling back to the first hardware device otherwise. This lets
# muzak321 work on PulseAudio systems, PipeWire systems, and plain ALSA systems.

pcm.!default {
    type pulse
    fallback "plughw:0,0"
    hint {
        show on
        description "PulseAudio Sound Server"
    }
}

ctl.!default {
    type pulse
    fallback "plughw:0,0"
}
