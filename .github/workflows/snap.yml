name: snap

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      snap-file: ${{ steps.snap-name.outputs.snap }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install snapcraft and build dependencies
        run: |
          sudo snap install snapcraft --classic
          sudo apt-get update -q
          sudo apt-get install -y gcc libasound2-dev
          export PATH="/snap/bin:$PATH"
          echo "/snap/bin" >> "$GITHUB_PATH"
          snapcraft --version

      - name: Build snap
        run: |
          export PATH="/snap/bin:$PATH"
          set +e
          /snap/bin/snapcraft --destructive-mode --verbosity verbose 2>&1 | tee /tmp/snapcraft-build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "=== FULL snapcraft log ==="
            cat /tmp/snapcraft-build.log
            echo "=== snapcraft internal logs ==="
            find "$HOME/.local/state/snapcraft/log" -name '*.log' -newermt '-10 minutes' -exec cat {} + 2>/dev/null || true
            exit "$rc"
          fi

      - name: Upload snapcraft log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapcraft-build-log
          path: /tmp/snapcraft-build.log

      - name: Record snap file name
        id: snap-name
        run: |
          echo "snap=$(ls *.snap | head -1)" >> "$GITHUB_OUTPUT"

      - name: Verify snap installs and runs
        run: |
          sudo snap install --dangerous "${{ steps.snap-name.outputs.snap }}"
          muzak321 -h

      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: muzak321-snap
          path: ${{ steps.snap-name.outputs.snap }}

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: muzak321-snap
          path: muzak321-snap

      - name: Publish snap to store (stable)
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
        with:
          snap: muzak321-snap/${{ needs.build.outputs.snap-file }}
          release: stable