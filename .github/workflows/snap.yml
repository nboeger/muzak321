name: snap

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      snap-file: ${{ steps.snap-name.outputs.snap }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Print runner environment
        run: |
          cat /etc/os-release | grep -E 'VERSION_ID|VERSION_CODENAME'
          ls /usr/lib/x86_64-linux-gnu/libapt-pkg.so.* 2>/dev/null

      - name: Install snapcraft and build dependencies
        run: |
          sudo snap install snapcraft --classic
          sudo apt-get update -q
          sudo apt-get install -y gcc libasound2-dev
          export PATH="/snap/bin:$PATH"
          echo "/snap/bin" >> "$GITHUB_PATH"
          snapcraft --version

      - name: Build snap
        run: |
          export PATH="/snap/bin:$PATH"
          echo "=== snapcraft version ==="
          /snap/bin/snapcraft --version 2>&1 || echo "version check FAILED rc=$?"
          echo "=== try as root ==="
          sudo /snap/bin/snapcraft --version 2>&1 || echo "root version check FAILED rc=$?"
          echo "=== build attempt (as runner) ==="
          set +e
          /snap/bin/snapcraft --destructive-mode >/tmp/snap-build.log 2>/tmp/snap-build.err
          rc=$?
          echo "=== SNAPCRAFT EXIT CODE: $rc ==="
          echo "=== STDOUT ==="; cat /tmp/snap-build.log
          echo "=== STDERR ==="; cat /tmp/snap-build.err
          echo "=== snapcraft internal logs ==="
          find /root /home/runner "$HOME" -path '*snapcraft*log*' -newermt '-20 minutes' 2>/dev/null | head -20
          find "$HOME/.local/state/snapcraft/log" -name '*.log' -newermt '-20 minutes' -exec cat {} + 2>/dev/null || true
          echo "=== end ==="
          exit "$rc"

      - name: Upload snapcraft log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapcraft-build-log
          path: /tmp/snap-build.log

      - name: Record snap file name
        id: snap-name
        run: |
          echo "snap=$(ls *.snap | head -1)" >> "$GITHUB_OUTPUT"

      - name: Verify snap installs and runs
        run: |
          sudo snap install --dangerous "${{ steps.snap-name.outputs.snap }}"
          muzak321 -h

      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: muzak321-snap
          path: ${{ steps.snap-name.outputs.snap }}

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: muzak321-snap
          path: muzak321-snap

      - name: Publish snap to store (stable)
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
        with:
          snap: muzak321-snap/${{ needs.build.outputs.snap-file }}
          release: stable