name: release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install cross-compilers and ALSA dev headers
        run: |
          sudo apt-get update -q
          sudo dpkg --add-architecture arm64
          # GitHub runner apt sources only cover amd64 (and fail on arm64).
          # Replace them with the Ubuntu ports archive, which serves arm64.
          sudo rm -f /etc/apt/sources.list.d/*.sources /etc/apt/sources.list
          echo "deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main universe" | sudo tee /etc/apt/sources.list
          echo "deb [arch=amd64] http://security.ubuntu.com/ubuntu jammy-security main universe" | sudo tee /etc/apt/sources.list.d/security.list
          printf 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main universe\ndeb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main universe\ndeb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main universe\n' | sudo tee /etc/apt/sources.list.d/arm64.list
          sudo apt-get update -q
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            libasound2-dev \
            libasound2-dev:arm64 \
            libc6:arm64

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}