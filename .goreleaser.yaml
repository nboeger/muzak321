version: 2

project_name: muzak321

before:
  hooks:
    - go mod tidy

builds:
  - id: muzak321
    main: .
    binary: muzak321
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CC=gcc
      - goos: linux
        goarch: arm64
        env:
          - CC=aarch64-linux-gnu-gcc

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    wrap_in_directory: false

nfpms:
  - id: muzak321
    package_name: muzak321
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: nboeger
    homepage: https://github.com/nboeger/muzak321
    maintainer: Nathan Boeger <nboeger@gmail.com>
    description: |-
      A command-line music player (MP3, FLAC, OGG, WAV) with a file
      browser, progress bar, and playlist. Streams live Internet radio
      and reads audio tags to show Title / Artist while playing.
    license: GPL-3.0
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    dependencies:
      - libasound2
    contents:
      - src: ./snap/gui/muzak321.png
        dst: /usr/share/icons/hicolor/512x512/apps/muzak321.png

checksum:
  name_template: "checksums.txt"

# Arch User Repository (AUR) — staged: generates muzak321-bin PKGBUILD into
# dist/ on every release without publishing (skip_upload: true). To go live:
# 1. Register on https://aur.archlinux.org (retry if 503; it is not global),
#    create the muzak321-bin package, and add your AUR SSH key.
# 2. Add the unencrypted AUR SSH private key as the AUR_KEY repo secret.
# 3. Set skip_upload to false.
aurs:
  - name: muzak321-bin
    homepage: https://github.com/nboeger/muzak321
    description: "Command-line music player (MP3, FLAC, OGG, WAV) with a file browser, progress bar, and playlist"
    maintainers:
      - "Nathan Boeger <nboeger@gmail.com>"
    license: GPL-3.0
    depends:
      - alsa-lib
    git_url: "ssh://aur@aur.archlinux.org/muzak321-bin.git"
    private_key: "{{ .Env.AUR_KEY }}"
    skip_upload: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch
